<!DOCTYPE html>
<html lang="ka">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Cards Task</title>


<style> 
    .container {
    padding: 20px;
}

.card {

    display: inline-block; 
    width: 200px;
    height: 150px;
    
    padding: 15px;
    border: 2px solid rgb(0, 0, 0);
    margin: 10px;
    
    vertical-align: top; 
    background-color: #ebe3e3;
}

.overflow-test {
    overflow: auto; 
}

.challenge-card {
    width: 50%; 
}
</style>

</head>
<body>

    <div class="container">
        
        
        <div class="card">
            <h2>HTML</h2>
            <p>
                HTML is used to create the structure of a web page.
            </p>
        </div>
      
        
        <div class="card">
            <h2>CSS</h2>
            <p>
                CSS is used to style and design web pages.
            </p>
        </div>
      
        
        <div class="card overflow-test">
            <h2>JavaScript</h2>
            <p>
                JavaScript makes web pages interactive. Here is some extra text to test how the overflow property works when content exceeds the box height limit. 
            </p>
        </div>

        
        <div class="card challenge-card">
            <h2>Challenge</h2>
            <p>
                CHALLENGE
            </p>
        </div>
      
    </div>


</body>
</html>
